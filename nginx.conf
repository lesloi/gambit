worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # A read-only root filesystem keeps every temporary file here, on the emptyDir the pod mounts.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app serves its own security headers, unless a proxy in front of it already does.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The hashed assets of a build never change under the same name.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # The service worker and the two entry points must be revalidated, or a deploy serves a stale app.
    location = /index.html {
      expires -1;
    }

    location = /sw.js {
      expires -1;
    }

    location = /manifest.webmanifest {
      # Some nginx versions have no mapping for `.webmanifest`, and a manifest served as
      # `application/octet-stream` is refused by the browser.
      default_type application/manifest+json;
      expires -1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
