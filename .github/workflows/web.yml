name: Web

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Node 26 ships no Corepack; this action reads the pnpm version pinned in package.json.
      - uses: pnpm/setup@v3
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The build is the check that the service worker and the PWA manifest are generated.
      - run: pnpm run build
